<!DOCTYPE html>
<html>

<head>

    <title>Update Page</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>Update Task</h1>

    <form method="POST">

        <input type="text"
               name="task"
               value="{{ task }}"
               required>

        <button type="submit">
            Update Task
        </button>

    </form>

</div>

</body>
</html>
